<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
    #panorama {
        width: 1920px;
        height: 1080px;
    }
    </style>
</head>
<body>

<div id="panorama"></div>
<script>
pannellum.viewer('panorama', {   
    "default": {
        "firstScene": "cab_center",
        "author": "FakeCicada",
        "sceneFadeDuration": 1000
    },

    "scenes": {
        "cab_center": {
            "title": "Cab Center",
            "hfov": 110,
            "pitch": -3,
            "yaw": 117,
            "type": "equirectangular",
            "panorama": "https://raw.githubusercontent.com/FakeCicada/360IMAGE_TEST/main/img/n2000_360_c.png",
            "hotSpots": [
                {
                    "pitch": 0,
                    "yaw": 0,
                    "type": "scene",
                    "text": "Driver",
                    "sceneId": "driver"
                },
				{
                    "pitch": 0,
                    "yaw": 90,
                    "type": "scene",
                    "text": "Cab",
                    "sceneId": "driver2"
                }
            ]
        },

        "driver": {
            "title": "Driver",
            "hfov": 110,
            "yaw": 5,
            "type": "equirectangular",
            "panorama": "https://raw.githubusercontent.com/FakeCicada/360IMAGE_TEST/main/img/n2000_360_d.png",
            "hotSpots": [
                {
                    "pitch": 0,
                    "yaw": 0,
                    "type": "scene",
                    "text": "Cab Center",
                    "sceneId": "cab_center",
                    "targetYaw": -23,
                    "targetPitch": 2
                }
            ]
        },

		"driver2": {
            "title": "Cab",
            "hfov": 110,
            "yaw": 5,
            "type": "equirectangular",
            "panorama": "https://raw.githubusercontent.com/FakeCicada/360IMAGE_TEST/main/img/n2000_360_d2.png",
            "hotSpots": [
                {
                    "pitch": 0,
                    "yaw": 0,
                    "type": "scene",
                    "text": "Cab Center",
                    "sceneId": "cab_center",
                    "targetYaw": -23,
                    "targetPitch": 2
                }
            ]
        },

		"passenger": {
            "title": "客室",
            "hfov": 110,
            "yaw": 5,
            "type": "equirectangular",
            "panorama": "https://raw.githubusercontent.com/FakeCicada/360IMAGE_TEST/main/img/n2000_360_p1.png",
            "hotSpots": [
                {
                    "pitch": 0,
                    "yaw": 0,
                    "type": "scene",
                    "text": "Cab Center",
                    "sceneId": "cab_center",
                    "targetYaw": -23,
                    "targetPitch": 2
                }
            ]
        }
    }
});
</script>

</body>
</html>
